[package]
name = "wasm"
version = "0.1.0"
edition = "2021"
authors = ["your name"]
description = "dependency-cruiser reporter"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen-test = { version = "0.3", optional = true }
tsify = { version = "0.4.5", features = ["js"] }

[features]
default = []
wasm-test = ["wasm-bindgen-test"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true