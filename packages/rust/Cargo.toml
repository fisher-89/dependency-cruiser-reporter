[package]
name = "wasm"
version = "0.1.0"
license = "MIT"
edition = "2021"
authors = ["your name"]
description = "dependency-cruiser reporter"
repository = "https://ksogitlab.kso.net/zhangbohan3/wps-agent-plugin"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
tsify = { version = "0.4.5", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true