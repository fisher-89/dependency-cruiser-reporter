name: Build and Deploy to Release Branch

on:
  push:
    branches:
      - main # 当 main 分支有代码推送时触发。你也可以改成 master

permissions:
  contents: write # 赋予 Action 写入仓库和推送分支的权限

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取 main 分支的源码
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. 安装 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # 开启 npm 缓存，加速后续构建

      # 3. 安装完整的开发依赖并进行打包
      - name: Install dependencies and Build
        run: |
          npm ci
          npm run build

      # 4. 将打包后的文件部署到单独的 release 分支
      - name: Deploy to release branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: release # 目标分支名，会自动创建
          folder: packages # 部署当前根目录的所有文件
          clean: false # 不删除未追踪的文件
          # 💡 可选优化：如果你不想把 src 源码推送到 release 分支，可以取消下面两行的注释
          # folder: dist
          # target-folder: dist
