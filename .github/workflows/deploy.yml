name: Build and Deploy to Release Branch

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write # 赋予 Action 写入仓库和推送分支的权限

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取当前 main 分支最新的代码
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # 必须拉取最近的 2 次提交，以便对比版本号是否真的改变了

      # 2. 检查 package.json 中的 version 是否真的升级了
      - name: Check if version increased
        id: check-version
        run: |
          # 获取上一次提交和当前提交的 version 字段
          OLD_VERSION=$(git show HEAD~1:package.json | jq -r '.version')
          NEW_VERSION=$(jq -r '.version' package.json)
          
          echo "旧版本: $OLD_VERSION"
          echo "新版本: $NEW_VERSION"
          
          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "版本号未发生改变，跳过构建。"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "检测到版本号升级！开始执行构建..."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # 3. 安装 pnpm 包管理器
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 4. 安装 Node.js 环境（仅在版本改变时执行）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 5. 安装 Rust 工具链和 wasm-pack（构建依赖）
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # 6. 安装完整的开发依赖并进行打包（仅在版本改变时执行）
      - name: Install dependencies and Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # 5. 将 packages 和 package.json 部署到 release 分支（仅在版本改变时执行）
      - name: Deploy to release branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: release
          folder: /
          clean: false